<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback | TeamSpin PRO</title>
<meta name="description" content="Submit feedback for TeamSpin PRO to improve features, themes, and usability.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <div class="nav-left"><a href="index.html">← Back to Home</a></div>
</nav>

<main style="padding:20px;">
  <h1>Feedback</h1>
  <form>
    <label for="name">Name (Optional):</label><br>
    <input type="text" id="name" name="name" style="width:100%; margin-bottom:10px;"><br>
    <label for="feedback">Your Feedback:</label><br>
    <textarea id="feedback" name="feedback" rows="6" style="width:100%;"></textarea><br>
    <button type="submit" class="btn btn-main" style="margin-top:10px;">Submit Feedback</button>
  </form>
  <p>All feedback is handled locally or via optional email integration. Supports all devices.</p>
</main>
</body>
</html>
