<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamSpin PRO – Free Wheel of Names | Random Picker</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#007bff">

<style>
:root{
    --primary: #007bff; /* Your Primary Blue */
    --primary-light: #e7f3ff;
    --bg: #fff;
    --text: #333;
    --sidebar-bg: #ffffff;
}

[data-theme="dark"]{--primary:#7dd3fc;--bg:#0f172a;--text:#f8fafc;--sidebar-bg:#1e293b;}

body{
    margin:0; font-family:system-ui,-apple-system;
    background:var(--bg); color:var(--text);
    transition: 0.3s;
}

/* HEADER */
.header-bar{
    display:flex; align-items:center; gap:16px;
    padding:12px 16px; border-bottom:1px solid #e5e7eb;
    background:var(--bg); position:sticky; top:0; z-index:1000;
}
.brand{font-size:20px; font-weight:700;}
.brand span{color:var(--primary);}
.nav-links{display:flex; gap:16px; flex-grow:1;}
.nav-links a{color:var(--primary); text-decoration:none; font-size:14px;}
.header-right{display:flex; gap:8px;}
select, .header-btn{padding:6px 10px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer;}

/* GRID LAYOUT */
.app-grid{
    display:grid;
    grid-template-columns: 320px 1fr 300px; /* Three columns for Entry, Wheel, and History */
    gap:20px; padding:20px;
}

/* SIDEBARS */
.sidebar{
    background: var(--sidebar-bg);
    border: 1px solid #eee;
    padding: 20px;
    border-radius: 12px;
    height: fit-content;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
#nameInput{
    width:100%; height:250px; padding:12px; font-size:15px; 
    box-sizing:border-box; border-radius:8px; border:1px solid #ccc;
    margin-bottom: 10px; resize: vertical;
}
.control-btn{
    padding:10px; border:1px solid #ccc; border-radius:8px;
    background:#f8fafc; cursor:pointer; width: 100%; margin-bottom: 8px;
    font-weight: 500; transition: 0.2s;
}
.control-btn:hover{ background: #edf2f7; border-color: var(--primary); }

/* WINNER HISTORY SECTION */
.history-container { margin-top: 10px; }
.history-list {
    list-style: none; padding: 0; margin: 0;
    max-height: 450px; overflow-y: auto;
    border: 1px solid #eee; border-radius: 8px;
}
.history-item {
    padding: 10px 15px; border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
}
.history-item:first-child { 
    background: var(--primary-light); 
    font-weight: bold; 
    color: var(--primary); 
    border-left: 4px solid var(--primary);
}

/* WHEEL COLUMN */
.wheel-column{ text-align:center; display:flex; flex-direction:column; align-items:center; }
.wheel-container{
    width: min(85vw, 500px);
    height: min(85vw, 500px);
    position: relative;
    margin-bottom: 40px; /* Gap between wheel and button */
    cursor: pointer;
}
canvas{ width:100%; height:100%; border-radius:50%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }

.pointer{
    position:absolute; top:-15px; left:50%; transform:translateX(-50%);
    z-index: 10;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 40px solid var(--primary); /* Primary color pointer */
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
}

/* FOOTER */
footer{ margin-top:60px; padding:40px; background:#f9fafb; border-top:1px solid #e5e7eb; text-align:center; }
footer nav{ display:flex; gap:20px; justify-content:center; margin-bottom: 15px; }
footer a{ color:var(--primary); text-decoration:none; font-size:14px; }

/* RESPONSIVE */
@media(max-width:1100px){
    .app-grid{ grid-template-columns: 1fr; display: flex; flex-direction: column; }
    .wheel-column{ order: -1; }
    .nav-links{ display:none; }
}
</style>
</head>

<body data-theme="classic">

<header class="header-bar">
    <div class="brand">TeamSpin <span>PRO</span></div>
    <nav class="nav-links">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="faq.html">FAQ</a>
    </nav>
    <div class="header-right">
        <select id="langSelect"><option value="en">EN</option><option value="np">NP</option><option value="hi">HI</option></select>
        <select id="themeSelect"><option value="classic">Classic</option><option value="dark">Dark</option></select>
        <button class="header-btn" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
</header>

<div class="app-grid">
    <aside class="sidebar">
        <h3 id="t_entries">Wheel Entries</h3>
        <textarea id="nameInput" placeholder="Enter names, one per line...">John
Alice
Bob
Sara</textarea>
        <p><strong>Entries:</strong> <span id="entryCount">4</span></p>
        <button class="control-btn" onclick="sortAsc()">Sort A–Z</button>
        <button class="control-btn" onclick="sortDesc()">Sort Z–A</button>
        <button class="control-btn" onclick="saveEntries()">Save List</button>
    </aside>

    <main class="wheel-column">
        <div class="wheel-container" id="wheelSection" onclick="spin()">
            <div class="pointer"></div>
            <canvas id="wheelCanvas"></canvas>
        </div>

        <button onclick="spin()" style="padding:20px 80px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-size:1.3rem; font-weight:bold; cursor:pointer; box-shadow: 0 10px 20px rgba(0,123,255,0.3);">
            SPIN THE WHEEL
        </button>

        <p style="margin-top:25px; font-size:24px;">Winner: <span id="latestWinner" style="color:var(--primary); font-weight:bold">-</span></p>
        <p style="font-size:14px; color:#888;">Total Spins in Session: <span id="spinCount">0</span></p>
    </main>

    <aside class="sidebar">
        <h3>Winner History</h3>
        <div class="history-container">
            <ul id="historyList" class="history-list">
                <li style="color:#aaa; text-align:center; padding:30px;">No winners yet</li>
            </ul>
        </div>
        <button class="control-btn" style="margin-top:15px; color: #dc3545;" onclick="clearHistory()">Clear History</button>
    </aside>
</div>

<footer>
    <nav>
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
        <a href="faq.html">FAQ</a>
    </nav>
    <p>© 2026 TeamSpin PRO – Professional Random Name Picker</p>
</footer>

<audio id="winSound" src="winner.mp3"></audio>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
let names = [], angle = 0, spins = 0, spinning = false;
const sound = document.getElementById("winSound");

// 1. RESPONSIVE SETUP
function resizeCanvas(){
    const size = canvas.parentElement.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.scale(dpr, dpr);
    draw();
}
window.addEventListener("resize", resizeCanvas);

// 2. DATA MANAGEMENT
function syncNames(){
    const raw = document.getElementById("nameInput").value.split("\n").map(n=>n.trim()).filter(Boolean);
    names = [...new Set(raw)];
    document.getElementById("entryCount").innerText = names.length;
    draw();
}
document.getElementById("nameInput").addEventListener("input", syncNames);

// 3. DRAWING THE WHEEL
function draw(){
    if(!names.length) return;
    const size = canvas.width / (window.devicePixelRatio || 1);
    const r = size / 2;
    const slice = 2 * Math.PI / names.length;
    ctx.clearRect(0, 0, size, size);

    ctx.save();
    ctx.translate(r, r);
    ctx.rotate(angle);

    names.forEach((n, i) => {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r - 10, i * slice, (i + 1) * slice);
        
        // Alternate Primary Blue Colors
        ctx.fillStyle = i % 2 === 0 ? "#007bff" : "#4dabff";
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw Names
        ctx.save();
        ctx.rotate(i * slice + slice / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(n, r - 40, 6);
        ctx.restore();
    });
    ctx.restore();
}

// 4. IDLE ROTATION (The "Slight Rotation" you requested)
function idleAnimation() {
    if (!spinning) {
        angle += 0.003; // Very slow crawl
        draw();
    }
    requestAnimationFrame(idleAnimation);
}

// 5. SPIN LOGIC
function spin(){
    if(spinning || !names.length) return;
    spinning = true;
    spins++;
    document.getElementById("spinCount").innerText = spins;
    
    let power = Math.random() * 2000 + 4000; // Random strength
    let duration = 4000; // 4 seconds
    let start = performance.now();

    function anim(t){
        let elapsed = t - start;
        let progress = Math.min(elapsed / duration, 1);
        
        // Custom easing for smooth stop
        let easeOut = 1 - Math.pow(1 - progress, 4);
        angle += (power * (1 - progress) * 0.002);
        
        draw();

        if(progress < 1) {
            requestAnimationFrame(anim);
        } else {
            spinning = false;
            const slice = 2 * Math.PI / names.length;
            const actualAngle = (angle % (2 * Math.PI));
            const idx = Math.floor(((2 * Math.PI - actualAngle + (3 * Math.PI / 2)) % (2 * Math.PI)) / slice);
            const winner = names[idx];
            
            document.getElementById("latestWinner").innerText = winner;
            updateHistory(winner);
            
            sound.play().catch(()=>{});
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    }
    requestAnimationFrame(anim);
}

// 6. HISTORY MANAGEMENT
function updateHistory(name) {
    const list = document.getElementById("historyList");
    if (spins === 1) list.innerHTML = ""; // Remove placeholder on first win
    
    const item = document.createElement("li");
    item.className = "history-item";
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    item.innerHTML = `<span>${name}</span> <span style="color:#888; font-size:12px;">${time}</span>`;
    
    list.prepend(item);
}

function clearHistory() {
    document.getElementById("historyList").innerHTML = '<li style="color:#aaa; text-align:center; padding:30px;">No winners yet</li>';
    spins = 0;
    document.getElementById("spinCount").innerText = 0;
    document.getElementById("latestWinner").innerText = "-";
}

// 7. UTILITIES
function sortAsc(){ names.sort(); document.getElementById("nameInput").value = names.join("\n"); syncNames(); }
function sortDesc(){ names.sort().reverse(); document.getElementById("nameInput").value = names.join("\n"); syncNames(); }
function saveEntries(){ localStorage.setItem("savedNames", document.getElementById("nameInput").value); alert("Names saved locally!"); }
function toggleFullscreen(){ 
    const el = document.getElementById("wheelSection");
    if(!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen();
}

// INITIALIZE
resizeCanvas();
syncNames();
idleAnimation();
</script>

</body>
</html>
