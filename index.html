<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamSpin PRO v15.0.6 | Professional 3D Decision Wheel</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    <meta name="description" content="Professional 3D Wheel of Names with CSV export, AdSense optimized.">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #007AFF; --red-3d: #d32f2f; --gold: #FFD700;
            --bg: #F0F2F5; --card: #ffffff; --text: #1c1e21;
        }

        [data-theme="dark"] { --bg: #18191a; --card: #242526; --text: #e4e6eb; }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; transition: background 0.3s; }

        /* --- FULL SCREEN (Ad-Visible) --- */
        body.fullscreen-active { overflow: hidden; background: #000 !important; }
        body.fullscreen-active nav, body.fullscreen-active .sidebar, body.fullscreen-active .v-badge, body.fullscreen-active .btn-main { display: none !important; }
        
        body.fullscreen-active .app-grid {
            grid-template-columns: 160px 1fr !important; 
            width: 100vw; height: 100vh;
        }

        body.fullscreen-active .ad-left { background: #111; border-right: 1px solid #333; }
        body.fullscreen-active .wheel-column { width: auto; height: 100vh; padding: 0; justify-content: center; }
        body.fullscreen-active .wheel-container { width: min(85vh, 70vw); }

        #exitFS {
            display: none; position: fixed; top: 20px; right: 20px; z-index: 9999;
            background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 10px 20px; border-radius: 5px; cursor: pointer;
        }
        body.fullscreen-active #exitFS { display: block; }

        /* --- LAYOUT --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--card); border-bottom: 1px solid #ddd; }
        .app-grid { display: grid; grid-template-columns: 160px 1fr 350px; min-height: calc(100vh - 60px); }
        .ad-left { background: #f9f9f9; border-right: 1px solid #ddd; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }

        .wheel-column { display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; }
        
        .wheel-container { 
            position: relative; 
            width: min(550px, 90vw, 75vh);
            aspect-ratio: 1; 
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.35));
        }
        
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }

        /* Professional 3D Pointer with Floating Shadow */
        .pointer-3d {
            position: absolute; right: -20px; top: 50%; transform: translateY(-50%);
            width: 70px; height: 45px; 
            background: linear-gradient(135deg, #ff4d4d 0%, #b30000 100%);
            clip-path: polygon(100% 50%, 0 0, 20% 50%, 0 100%);
            z-index: 100; 
            filter: drop-shadow(-8px 8px 6px rgba(0,0,0,0.5));
        }

        .sidebar { padding: 20px; background: var(--card); border-left: 1px solid #ddd; }
        textarea { width: 100%; height: 350px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; padding: 12px; font-family: inherit; resize: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn { padding: 10px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; background: var(--card); color: var(--text); }
        .btn-main { background: var(--primary); color: white; border: none; grid-column: span 2; padding: 15px; font-size: 18px; cursor: pointer; }

        .v-badge { position: fixed; bottom: 10px; left: 10px; font-size: 10px; opacity: 0.5; }

        @media(max-width: 1100px) { .app-grid { grid-template-columns: 1fr; } .ad-left, .sidebar { display: none; } }
    </style>
</head>
<body>

<button id="exitFS" onclick="toggleFullScreen()">Exit Full Screen (F)</button>

<nav>
    <div class="brand" onclick="location.reload()">TeamSpin <b>PRO</b></div>
    <div style="display:flex; gap:10px;">
        <button class="btn" onclick="toggleFullScreen()">Presentation Mode</button>
    </div>
</nav>

<div class="app-grid">
    <aside class="ad-left" id="adSidebar">
        <div id="adContainer" style="width:120px; height:600px; background:#eee; display:flex; align-items:center; text-align:center; font-size:10px; border: 1px dashed #ccc;">
            <p style="padding:10px">ADVERTISING SLOT<br>(Refreshing on Spin)</p>
        </div>
    </aside>

    <main class="wheel-column">
        <div class="wheel-container">
            <div class="pointer-3d"></div>
            <canvas id="wheelCanvas" width="1000" height="1000" onclick="spin()"></canvas>
        </div>
        <button class="btn btn-main" style="margin-top:20px; width:300px; border-radius:50px;" onclick="spin()">SPIN NOW</button>
        
        <div style="margin-top:20px; display:flex; gap:20px;">
            <div>Total Spins: <b id="sessionCount">0</b></div>
            <div id="winnerHistory" style="font-size:12px; color:var(--primary)">Latest Winner: None</div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="card">
            <h3>Entries</h3>
            <textarea id="nameInput" oninput="draw()">Kushal&#10;Ram&#10;Sita&#10;Anish&#10;Rita</textarea>
            
            <div class="controls">
                <button class="btn" onclick="shuffleNames()">Shuffle</button>
                <button class="btn" onclick="exportCSV()">Export CSV</button>
            </div>
        </div>
    </aside>
</div>

<div class="v-badge">v15.0.6-PRO-FINAL</div>

<script>
    const canvas = document.getElementById('wheelCanvas'), ctx = canvas.getContext('2d');
    const nameInput = document.getElementById('nameInput');
    let rotation = 0, isSpinning = false, totalSpins = 0;

    const palettes = { light: ['#FF3B30', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#007AFF', '#5856D6', '#FF2D55'] };

    function draw() {
        const names = nameInput.value.split('\n').filter(Boolean);
        const arc = (Math.PI * 2) / names.length;
        ctx.clearRect(0,0,1000,1000);
        const centerX = 500, centerY = 500, radius = 480;

        names.forEach((name, i) => {
            const angle = rotation + i * arc;
            ctx.save();
            ctx.beginPath();
            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            const baseCol = palettes.light[i % palettes.light.length];
            grad.addColorStop(0, shadeColor(baseCol, 15));
            grad.addColorStop(0.7, baseCol);
            grad.addColorStop(1, shadeColor(baseCol, -25));
            ctx.fillStyle = grad;
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, angle, angle + arc);
            ctx.fill();

            ctx.translate(centerX, centerY);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "white";
            ctx.font = "bold 42px Segoe UI";
            ctx.shadowBlur = 8; ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.fillText(name.substring(0, 18), radius * 0.9, 15);
            ctx.restore();
        });

        ctx.beginPath();
        ctx.arc(centerX, centerY, 45, 0, Math.PI*2);
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 20; ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.fill();
    }

    function refreshAd() {
        console.log("Refreshing Ads...");
        const container = document.getElementById('adContainer');
        // Logic to push a new AdSense request
        if(window.adsbygoogle) {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e){}
        }
        // Visual feedback for development
        container.style.opacity = "0.5";
        setTimeout(() => container.style.opacity = "1", 300);
    }

    function spin() {
        if (isSpinning || nameInput.value.split('\n').filter(Boolean).length < 2) return;
        isSpinning = true;
        const duration = 6000;
        const targetRot = rotation + (Math.PI * 2 * 12) + Math.random() * (Math.PI * 2);
        const start = performance.now();

        function animate(now) {
            const p = (now - start) / duration;
            if (p < 1) {
                const ease = 1 - Math.pow(1 - p, 4);
                rotation = targetRot * ease;
                draw();
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                totalSpins++;
                document.getElementById('sessionCount').innerText = totalSpins;
                const names = nameInput.value.split('\n').filter(Boolean);
                const winIdx = Math.floor(((Math.PI * 2) - (rotation % (Math.PI * 2))) / ((Math.PI * 2) / names.length)) % names.length;
                document.getElementById('winnerHistory').innerText = `Latest Winner: ${names[winIdx]}`;
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                
                // Trigger Ad Refresh on win
                refreshAd();
            }
        }
        requestAnimationFrame(animate);
    }

    function toggleFullScreen() {
        document.body.classList.toggle('fullscreen-active');
        setTimeout(draw, 200); 
    }

    document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'f') toggleFullScreen();
        if (e.code === 'Space' && !isSpinning) spin();
    });

    function shuffleNames() {
        const a = nameInput.value.split('\n').filter(Boolean);
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        nameInput.value = a.join('\n'); draw();
    }

    function exportCSV() {
        const blob = new Blob([nameInput.value], {type: 'text/csv'});
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'winners.csv'; a.click();
    }

    function shadeColor(color, percent) {
        var R = parseInt(color.substring(1,3),16), G = parseInt(color.substring(3,5),16), B = parseInt(color.substring(5,7),16);
        R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
        R = R<255?R:255; G = G<255?G:255; B = B<255?B:255;
        return "#"+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1);
    }

    window.onload = draw;
</script>
</body>
</html>
