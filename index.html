<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamSpin PRO – Free Wheel of Names | Random Picker</title>

<!-- SEO -->
<meta name="description" content="TeamSpin PRO is a free wheel of names tool to spin, save, share, and randomly pick winners. Perfect for games, classrooms, giveaways, and decision making.">
<meta name="keywords" content="wheel of names, random picker, spin wheel, lucky draw, decision wheel">
<meta name="author" content="TeamSpin PRO">

<style>
:root{
--primary:#007bff;
--bg:#fff;
--text:#333;
}
body{margin:0;font-family:system-ui,-apple-system;background:var(--bg);color:var(--text);}

/* HEADER */
.header-bar{
display:flex;align-items:center;gap:16px;
padding:12px 16px;border-bottom:1px solid #e5e7eb;
background:#fff;position:sticky;top:0;z-index:1000;
}
.brand{font-size:20px;font-weight:700;}
.brand span{color:var(--primary);}
.nav-links{display:flex;gap:16px;flex-grow:1;}
.nav-links a{color:var(--primary);text-decoration:none;font-size:14px;}
.header-right{display:flex;gap:8px;}
select,.header-btn{padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;}

/* GRID */
.app-grid{
display:grid;
grid-template-columns:320px 1fr 260px;
gap:20px;padding:20px;
}

/* SIDEBAR */
.sidebar{background:#fff;border:1px solid #eee;padding:16px;border-radius:12px;}
#nameInput{width:100%;height:260px;padding:10px;font-size:15px;border-radius:8px;border:1px solid #ccc;}
.control-btn{padding:10px;border:1px solid #ccc;border-radius:8px;background:#f8fafc;cursor:pointer}

/* WHEEL */
.wheel-column{text-align:center;display:flex;flex-direction:column;align-items:center;}
.wheel-container{width:520px;height:520px;border-radius:50%;background:#f3f4f6;box-shadow:0 15px 40px rgba(0,0,0,.15);position:relative;}
canvas{width:100%!important;height:100%!important;border-radius:50%;}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #ff4757;}

/* CTA */
.cta-box{margin-top:40px;padding:28px;background:#eef6ff;border-radius:14px;}
.cta-box a{display:inline-block;margin-top:15px;padding:14px 28px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-weight:600}

/* FOOTER */
footer{margin-top:60px;padding:28px;background:#f9fafb;border-top:1px solid #e5e7eb;text-align:center;}
footer nav{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
footer a{color:var(--primary);text-decoration:none;font-size:14px}

/* MOBILE */
@media(max-width:768px){
.app-grid{display:flex;flex-direction:column;}
.wheel-column{order:-1;}
.wheel-container{width:90vw;height:90vw;}
.nav-links{display:none;}
}
</style>
</head>

<body>

<header class="header-bar">
<div class="brand">TeamSpin <span>PRO</span></div>
<nav class="nav-links">
<a href="privacy.html">Privacy</a>
<a href="terms.html">Terms</a>
<a href="faq.html">FAQ</a>
<a href="feedback.html">Feedback</a>
</nav>
<div class="header-right">
<select id="themeSelect">
<option value="classic">Classic</option>
<option value="neon">Neon</option>
<option value="pastel">Pastel</option>
<option value="dark">Dark</option>
<option value="casino">Casino</option>
</select>
<button class="header-btn" onclick="toggleFullscreen()">Fullscreen</button>
</div>
</header>

<div class="app-grid">

<!-- SIDEBAR -->
<aside class="sidebar">
<h3>Wheel Entries</h3>
<textarea id="nameInput">John
Alice
Bob
Sara</textarea>

<p><strong>User Count:</strong> <span id="entryCount">4</span></p>

<div style="display:grid;gap:8px;margin-top:10px;">
<button class="control-btn" onclick="sortAsc()">Sort A–Z</button>
<button class="control-btn" onclick="sortDesc()">Sort Z–A</button>
<button class="control-btn" onclick="saveEntries()">Save</button>
<button class="control-btn" onclick="shareEntries()">Share</button>
</div>
</aside>

<!-- WHEEL -->
<main class="wheel-column">

<div class="wheel-container" id="wheelSection">
<div class="pointer"></div>
<canvas id="wheelCanvas" width="600" height="600"></canvas>
</div>

<button onclick="spin()" style="padding:18px 60px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:1.2rem;font-weight:bold;">
SPIN THE WHEEL
</button>

<p style="margin-top:15px;font-size:18px;">
Winner: <span id="latestWinner" style="color:var(--primary);font-weight:bold">-</span>
</p>

<div class="cta-box">
<h3>Feeling Lucky?</h3>
<p>If you are interested to spin then click here.</p>
<a href="#wheelSection">Want to know your luck? Spin here</a>
</div>

<p style="margin-top:25px;font-size:13px;color:#888;">
Version 2.1.0 | Total Spins: <span id="spinCount">0</span>
</p>
</main>

<aside></aside>
</div>

<footer>
<p>© 2026 TeamSpin PRO – Free Wheel of Names</p>
<nav>
<a href="index.html">Home</a>
<a href="privacy.html">Privacy</a>
<a href="terms.html">Terms</a>
<a href="faq.html">FAQ</a>
</nav>
</footer>

<!-- SOUNDS -->
<audio id="winSound" src="winner.mp3"></audio>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const canvas=document.getElementById("wheelCanvas");
const ctx=canvas.getContext("2d");
let names=[],angle=0,spins=0,spinning=false;
const sound=document.getElementById("winSound");

/* LOAD SAVED */
if(localStorage.names){
document.getElementById("nameInput").value=localStorage.names;
}

function syncNames(){
const raw=document.getElementById("nameInput").value.split("\n").map(n=>n.trim()).filter(Boolean);
names=[...new Set(raw)];
document.getElementById("entryCount").innerText=names.length;
draw();
}
document.getElementById("nameInput").addEventListener("input",syncNames);

function draw(){
if(!names.length)return;
const r=canvas.width/2;
const slice=2*Math.PI/names.length;
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.save();ctx.translate(r,r);ctx.rotate(angle);
names.forEach((n,i)=>{
ctx.beginPath();
ctx.fillStyle=`hsl(${i*360/names.length},70%,60%)`;
ctx.moveTo(0,0);
ctx.arc(0,0,r,i*slice,(i+1)*slice);
ctx.fill();
ctx.save();
ctx.rotate(i*slice+slice/2);
ctx.textAlign="right";
ctx.font="bold 18px sans-serif";
ctx.fillStyle="#000";
ctx.fillText(n,r-20,6);
ctx.restore();
});
ctx.restore();
}

function spin(){
if(spinning||!names.length)return;
spinning=true;spins++;
document.getElementById("spinCount").innerText=spins;
let power=Math.random()*3000+2000;
let start=performance.now();
function anim(t){
let p=Math.min((t-start)/3000,1);
angle+=power*(1-p)*0.002;
draw();
if(p<1)requestAnimationFrame(anim);
else{
spinning=false;
let slice=2*Math.PI/names.length;
let idx=Math.floor(((2*Math.PI-angle%(2*Math.PI))/slice)%names.length);
document.getElementById("latestWinner").innerText=names[idx];
sound.play();
confetti({particleCount:200,spread:80});
}
}
requestAnimationFrame(anim);
}

/* EXTRAS */
function saveEntries(){localStorage.names=document.getElementById("nameInput").value;alert("Saved!");}
function shareEntries(){
const text=document.getElementById("nameInput").value;
navigator.share?navigator.share({text}):navigator.clipboard.writeText(text);
}
function sortAsc(){names.sort();document.getElementById("nameInput").value=names.join("\n");syncNames();}
function sortDesc(){names.sort().reverse();document.getElementById("nameInput").value=names.join("\n");syncNames();}
function toggleFullscreen(){
let el=document.getElementById("wheelSection");
document.fullscreenElement?document.exitFullscreen():el.requestFullscreen();
}

syncNames();
</script>

</body>
</html>
