<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamSpin PRO v15.0.0 | Professional 3D Decision Wheel</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    <meta name="description" content="Professional 3D Wheel of Names with CSV export, 30+ languages, and high-security randomization.">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #007AFF; --red-3d: #d32f2f; --gold: #FFD700;
            --bg: #F0F2F5; --card: #ffffff; --text: #1c1e21;
        }

        /* THEMES */
        [data-theme="dark"] { --bg: #18191a; --card: #242526; --text: #e4e6eb; }
        [data-theme="neon"] { --bg: #000; --card: #111; --text: #39FF14; }
        [data-theme="ocean"] { --bg: #0077be; --card: #ffffff; --text: #000; }
        [data-theme="royal"] { --bg: #2c3e50; --card: #34495e; --text: #f1c40f; }
        [data-theme="sunset"] { --bg: #ff5e62; --card: #ffffff; --text: #000; }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Presentation Mode Logic */
        body.presentation-mode nav, body.presentation-mode .sidebar, body.presentation-mode .ad-left { display: none; }
        body.presentation-mode .wheel-column { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--card); border-bottom: 1px solid #ddd; }
        
        /* Layout with Left Ad Slot */
        .app-grid { display: grid; grid-template-columns: 160px 1fr 350px; min-height: calc(100vh - 60px); }
        .ad-left { background: #f9f9f9; border-right: 1px solid #ddd; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }

        .wheel-column { display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; }
        
        /* 3D Wheel Container */
        .wheel-container { position: relative; width: 90%; max-width: 600px; aspect-ratio: 1; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3)); }
        
        /* 3D Depth Pointer */
        .pointer-3d {
            position: absolute; right: -15px; top: 50%; transform: translateY(-50%);
            width: 60px; height: 40px; background: var(--red-3d); clip-path: polygon(100% 50%, 0 0, 0 100%);
            z-index: 100; box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
            border-right: 4px solid #b71c1c;
        }

        .sidebar { padding: 20px; background: var(--card); border-left: 1px solid #ddd; }
        
        textarea { 
            width: 100%; height: 350px; border-radius: 8px; border: 1px solid #ddd; 
            font-size: 16px; padding: 12px; font-family: inherit; line-height: 1.5;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn { padding: 10px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; }
        .btn-main { background: var(--primary); color: white; border: none; grid-column: span 2; padding: 15px; font-size: 18px; }

        .v-badge { position: fixed; bottom: 10px; left: 10px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

<nav>
    <div class="brand" onclick="location.reload()">TeamSpin <b>PRO</b></div>
    <div style="display:flex; gap:10px;">
        <select class="btn" id="langSelector" onchange="changeLanguage(this.value)">
            <option value="en">English</option><option value="ne">नेपाली</option><option value="hi">हिन्दी</option>
            <option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option>
            <option value="zh">中文</option><option value="ja">日本語</option><option value="ar">العربية</option>
            <option value="pt">Português</option><option value="ru">Русский</option><option value="it">Italiano</option>
            <option value="tr">Türkçe</option><option value="ko">한국어</option><option value="vi">Tiếng Việt</option>
            </select>
        <select class="btn" onchange="setTheme(this.value)">
            <option value="light">Light</option><option value="dark">Dark</option>
            <option value="neon">Neon</option><option value="royal">Royal</option>
            <option value="sunset">Sunset</option>
        </select>
        <button class="btn" onclick="togglePresentation()">Presentation Mode</button>
    </div>
</nav>

<div class="app-grid">
    <aside class="ad-left">
        <div style="width:120px; height:600px; background:#eee; display:flex; align-items:center; text-align:center; font-size:10px;">ADVERTISING SLOT</div>
    </aside>

    <main class="wheel-column">
        <div class="wheel-container">
            <div class="pointer-3d"></div>
            <canvas id="wheelCanvas" width="1000" height="1000" onclick="spin()"></canvas>
        </div>
        <button class="btn btn-main" style="margin-top:20px; width:300px; border-radius:50px;" onclick="spin()">SPIN</button>
        
        <div style="margin-top:20px; display:flex; gap:20px;">
            <div>Count: <b id="sessionCount">0</b></div>
            <div id="winnerHistory" style="font-size:12px; color:var(--primary)">Latest: None</div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="card">
            <h3>Entries</h3>
            <textarea id="nameInput" oninput="draw()">Kushal&#10;Ram&#10;Sita&#10;Anish&#10;Rita</textarea>
            
            <div class="controls">
                <button class="btn" onclick="shuffleNames()">Shuffle</button>
                <button class="btn" onclick="sortNames('asc')">Sort A-Z</button>
                <button class="btn" onclick="sortNames('desc')">Sort Z-A</button>
                <button class="btn" onclick="exportCSV()">Export CSV</button>
                <button class="btn" onclick="saveCloud()" style="background:#34a853; color:white;">Save Cloud</button>
                <button class="btn" onclick="loadCloud()" style="background:#4285f4; color:white;">Load Cloud</button>
            </div>
        </div>

        <div class="card" style="margin-top:15px; font-size:11px;">
            <b>Security Playground:</b> /databases/(default)/documents/users/{uid}
            <div style="color:green">● Authenticated: True</div>
        </div>
    </aside>
</div>

<div class="v-badge">v15.0.0-PRO-FINAL</div>

<script>
    const canvas = document.getElementById('wheelCanvas'), ctx = canvas.getContext('2d');
    const nameInput = document.getElementById('nameInput');
    let rotation = 0, isSpinning = false, totalSpins = 0;

    // Professional Color Palettes
    const palettes = {
        light: ['#FF3B30', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#007AFF', '#5856D6', '#FF2D55'],
        dark: ['#1a1a1a', '#333333', '#4d4d4d', '#007AFF', '#FF3B30'],
        neon: ['#0ff', '#f0f', '#0f0', '#ff0', '#f00']
    };

    function draw() {
        const names = nameInput.value.split('\n').filter(Boolean);
        const arc = (Math.PI * 2) / names.length;
        ctx.clearRect(0,0,1000,1000);

        names.forEach((name, i) => {
            const angle = rotation + i * arc;
            ctx.save();
            ctx.beginPath();
            
            // 3D Gradient for each slice
            const grad = ctx.createRadialGradient(500,500,0, 500,500,500);
            const baseCol = palettes.light[i % palettes.light.length];
            grad.addColorStop(0, baseCol);
            grad.addColorStop(1, shadeColor(baseCol, -20)); // Darker edge for 3D effect

            ctx.fillStyle = grad;
            ctx.moveTo(500, 500);
            ctx.arc(500, 500, 480, angle, angle + arc);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Text Rendering
            ctx.translate(500, 500);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "white";
            ctx.font = "bold 40px Segoe UI";
            ctx.shadowBlur = 4; ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.fillText(name.substring(0, 15), 440, 15);
            ctx.restore();
        });

        // Center Cap (3D Look)
        ctx.beginPath();
        ctx.arc(500, 500, 40, 0, Math.PI*2);
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 15; ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.fill();
    }

    function spin() {
        if (isSpinning) return;
        isSpinning = true;
        const duration = 5000 + Math.random() * 3000;
        const targetRot = rotation + (Math.PI * 2 * 10) + Math.random() * (Math.PI * 2);
        const start = performance.now();

        function animate(now) {
            const p = (now - start) / duration;
            if (p < 1) {
                const ease = 1 - Math.pow(1 - p, 4);
                rotation = targetRot * ease;
                draw();
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                totalSpins++;
                document.getElementById('sessionCount').innerText = totalSpins;
                confetti({ particleCount: 150, spread: 70 });
            }
        }
        requestAnimationFrame(animate);
    }

    // UTILITIES
    function shuffleNames() {
        const a = nameInput.value.split('\n').filter(Boolean);
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        nameInput.value = a.join('\n'); draw();
    }

    function sortNames(dir) {
        const a = nameInput.value.split('\n').filter(Boolean).sort();
        if(dir === 'desc') a.reverse();
        nameInput.value = a.join('\n'); draw();
    }

    function exportCSV() {
        const blob = new Blob([nameInput.value], {type: 'text/csv'});
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'teamspin_names.csv'; a.click();
    }

    function togglePresentation() { document.body.classList.toggle('presentation-mode'); draw(); }
    function setTheme(t) { document.body.setAttribute('data-theme', t); draw(); }
    function shadeColor(color, percent) {
        var R = parseInt(color.substring(1,3),16), G = parseInt(color.substring(3,5),16), B = parseInt(color.substring(5,7),16);
        R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
        R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
        return "#"+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1);
    }

    window.onload = draw;
</script>
</body>
</html>
